
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Tradingtagebuch</title>
  <style>
    body {
      margin: 0;
      background: #0b1120;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 24px;
      background: #111827;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0; }
    main { padding: 20px; }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 15px;
    }
    .value {
      font-size: 28px;
      font-weight: bold;
      color: #22c55e;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tradingtagebuch</h1>
    <p>Mein persönliches Trading Journal</p>
  </header>

  <main>
    <div class="card">
      <h3>Gesamtergebnis</h3>
      <div class="value">0,00 €</div>
    </div>

    <div class="card">
      <h3>Anzahl Trades</h3>
      <div class="value">0</div>
    </div>

    <div class="card">
      <h3>Trefferquote</h3>
      <div class="value">0 %</div>
    </div>

    <div class="card">
      <h3>Profit Factor</h3>
      <div class="value">–</div>
    </div>
  </main>
</body>
</html>
